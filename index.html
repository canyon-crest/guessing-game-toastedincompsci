<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Guessing Game</title>
  <link href="styles.css" rel="stylesheet" type="text/css"/>
</head>

<body>
  <p id="date"></p>
  <h3>Level</h3>

  <input type="radio" name="level" id="easy" value="3" checked>
  <label for="easy">Easy</label>
  <input type="radio" name="level" id="medium" value="10" checked>
  <label for="medium">Medium</label>
  <input type="radio" name="level" id="hard" value="100">
  <label for="hard">Hard</label>

  <button id="playBtn">Play</button>

  <h3 id="MSG">Select a level and press Play</h3>

  <input type="text" id="guess" disabled placeholder="Enter your guess">
  <button id="guessBtn" disabled>Guess</button>

  <p id="timer">Time: 0 seconds</p>

  <h3>Stats</h3>
  <p id="wins">Total wins: 0</p>
  <p id="avgScore">Average score: N/A</p>

  <h3>Leaderboard</h3>
  <ol id="leaderboard">
    <li class="leaderboard-item">—</li>
    <li class="leaderboard-item">—</li>
    <li class="leaderboard-item">—</li>
  </ol>

  <script src="script.js"></script>
</body>

</html>
